# Forged PXE provisioning server
#
# Runs in ProxyDHCP mode — coexists with existing router DHCP.
# Only responds to PXE boot requests, doesn't assign IPs.

# Disable DNS (we only need DHCP + TFTP)
port=0

# Bind only to the LAN interface (avoids conflict with OrbStack on *:67)
listen-address=${SERVER_IP}
bind-interfaces

# Run as the invoking user (macOS blocks nobody from ~/dev paths)
user=${FORGED_USER}

# ProxyDHCP: respond to PXE requests on the existing subnet
# The subnet is auto-detected from the host's interface
dhcp-range=192.168.1.0,proxy

# Serve iPXE EFI binary via TFTP, then chainload our boot script
# First boot: serve ipxe.efi firmware
# Once iPXE is loaded: serve the boot script via HTTP
dhcp-match=set:ipxe,175
dhcp-boot=tag:!ipxe,ipxe.efi
dhcp-boot=tag:ipxe,http://${SERVER_IP}:8070/ipxe/boot.ipxe

# TFTP server
enable-tftp
tftp-root=${TFTP_ROOT}

# Logging
log-dhcp
log-queries
